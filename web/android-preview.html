<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quasar Android UI Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#070b14;--bg-2:#0e1627;--midnight:#0b1020;--navy:#141c33;--panel:#1a2340;--panel-soft:#101a2e;--paper:#f1f4ff;--steel:#8f9bbd;--accent:#7c5cff;--accent-2:#5eead4;--ok:#2ecc71;--warn:#f5a524;--bad:#ff5d6c;--line:#2a355c;--shadow:rgba(8,11,22,0.55)}
    *{box-sizing:border-box;margin:0}
    html{scroll-behavior:smooth}
    body{font-family:Inter,Roboto,system-ui,sans-serif;background:radial-gradient(circle at top,rgba(124,92,255,.18),transparent 25%),linear-gradient(180deg,var(--bg) 0%,#090d18 100%);color:var(--paper);line-height:1.5}
    header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:rgba(7,11,20,.84);backdrop-filter:blur(12px);z-index:20}
    header h1{font-size:1.1rem;margin-right:auto;letter-spacing:.04em}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{background:var(--panel-soft);color:var(--paper);border:1px solid var(--line);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:700;transition:all .2s ease}
    .tab:hover{border-color:rgba(124,92,255,.7);transform:translateY(-1px)}
    .tab.on{background:linear-gradient(135deg,var(--accent),#8d7af8);border-color:transparent;box-shadow:0 10px 30px rgba(124,92,255,.28)}
    main{max-width:1200px;margin:0 auto;padding:24px}
    .view{display:none}.view.on{display:block}
    .layout{display:grid;grid-template-columns:260px 1fr 300px;gap:24px;align-items:start}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}}
    .list{background:rgba(20,28,51,.96);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 20px 50px var(--shadow)}
    .list h4{font-size:.72rem;letter-spacing:.12em;color:var(--steel);padding:10px 10px 4px}
    .item{padding:9px 12px;border-radius:11px;cursor:pointer;color:var(--steel);font-size:.92rem;transition:all .18s ease}
    .item:hover{background:rgba(255,255,255,.04);color:var(--paper)}.item.on{background:linear-gradient(135deg,rgba(124,92,255,.9),rgba(124,92,255,.7));color:#fff;box-shadow:0 8px 20px rgba(124,92,255,.18)}
    .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
    .phone{width:320px;height:660px;border-radius:42px;border:9px solid #050a11;background:linear-gradient(180deg,#0d1425,#070b14);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.7);position:relative}
    .phone::before{content:"";position:absolute;inset:14px 12px auto;height:18px;border-radius:999px;background:rgba(255,255,255,.06);z-index:5}
    .status{display:flex;justify-content:space-between;padding:10px 20px 4px;font-size:.72rem;color:var(--steel);background:rgba(7,11,20,.25)}
    .screen{flex:1;overflow-y:auto;padding:18px 20px 20px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0d1425 0%,#0a1220 100%)}
    .screen::-webkit-scrollbar{width:0}
    .screen h2{font-size:1.45rem;margin-bottom:6px;font-weight:800}
    .muted{color:var(--steel);font-size:.85rem}
    .center{justify-content:center}
    .logo{font-size:2rem;font-weight:900;letter-spacing:.16em;text-align:center;background:linear-gradient(135deg,#fff,#a6b3ff 40%,#7c5cff 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:.95rem;font-weight:800;cursor:pointer;margin-top:12px;color:#fff;background:linear-gradient(135deg,var(--accent),#8a7dff);box-shadow:0 12px 20px rgba(124,92,255,.25);transition:transform .15s ease, box-shadow .15s ease}
    .btn:hover{transform:translateY(-1px)}
    .btn.ghost{background:transparent;border:1px solid var(--steel);color:var(--paper);box-shadow:none}
    .btn.sm{padding:8px;font-size:.8rem;margin-top:8px}
    .field{background:rgba(20,28,51,.95);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;color:var(--steel);font-size:.9rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
    .card{background:rgba(20,28,51,.96);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 14px 30px rgba(0,0,0,.15)}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .bar{height:8px;border-radius:99px;background:var(--midnight);overflow:hidden;margin-top:10px;border:1px solid rgba(255,255,255,.04)}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .4s}
    .provider{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px;border:1px solid transparent;border-radius:12px;transition:all .15s ease}
    .provider:hover{background:rgba(255,255,255,.03)}
    .provider.sel{border-color:rgba(124,92,255,.9);background:rgba(124,92,255,.08);box-shadow:0 0 0 1px rgba(124,92,255,.5)}
    .ico{width:34px;height:34px;border-radius:10px;background:rgba(10,15,26,.9);display:grid;place-items:center;font-weight:900}
    .price{color:var(--accent-2);font-weight:800}
    .chip{font-size:.7rem;padding:3px 8px;border-radius:99px;background:rgba(124,92,255,.12);color:#d9d1ff;border:1px solid rgba(124,92,255,.18)}
    .code{font-family:ui-monospace,Consolas,monospace;font-size:1.05rem;text-align:center;color:var(--accent-2);letter-spacing:.05em;word-break:break-all}
    .nav{display:flex;gap:10px}
    .nav button{background:var(--navy);color:var(--paper);border:1px solid var(--line);padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:600}
    .side{background:rgba(20,28,51,.96);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:.88rem;box-shadow:0 18px 40px var(--shadow)}
    .side h3{margin-bottom:6px;font-size:1rem}.side li{margin-left:18px;color:var(--steel);margin-top:4px}
    .note{background:rgba(245,165,36,.08);border:1px solid rgba(245,165,36,.35);color:#ffd98a;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.88rem}
    .note.red{background:rgba(255,93,108,.08);border-color:rgba(255,93,108,.35);color:#ffb3bd}
    .note.green{background:rgba(46,204,113,.08);border-color:rgba(46,204,113,.36);color:#a6f0c4}
    /* ADB guide */
    .guide{display:grid;grid-template-columns:280px 1fr;gap:24px}
    @media(max-width:900px){.guide{grid-template-columns:1fr}}
    .step{display:block;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--steel);border:1px solid transparent;transition:all .15s ease}
    .step:hover{background:rgba(255,255,255,.03)}.step.on{background:rgba(124,92,255,.08);border-color:rgba(124,92,255,.5);color:var(--paper)}
    .step.done{color:var(--ok)}
    .pane{background:rgba(20,28,51,.96);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 24px 45px rgba(0,0,0,.2)}
    .pane h2{margin-bottom:8px}.pane h3{margin:18px 0 6px;font-size:1.02rem}
    .pane p,.pane li{color:#cdd5f3}.pane ol,.pane ul{margin:8px 0 8px 22px}.pane li{margin:5px 0}
    pre{background:#05070f;border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;font-size:.88rem;position:relative;margin:10px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
    code{font-family:ui-monospace,Consolas,monospace;color:#9fe3ff}
    .copy{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--accent),#8a7dff);border:none;color:#fff;border-radius:7px;padding:3px 9px;font-size:.72rem;cursor:pointer}
    .os{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
    .os button{background:var(--midnight);border:1px solid var(--line);color:var(--steel);padding:6px 14px;border-radius:9px;cursor:pointer}
    .os button.on{background:linear-gradient(135deg,var(--accent),#8a7dff);color:#fff;border-color:transparent}
    .ospane{display:none}.ospane.on{display:block}
    .foot{display:flex;justify-content:space-between;margin-top:22px;gap:12px;flex-wrap:wrap}
    .chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
    .chk input{margin-top:5px}
    table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem}
    th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:rgba(12,18,31,.94)}
    summary{cursor:pointer;font-weight:700;margin:8px 0}
  </style>
</head>
<body>
  <header>
    <h1>🔒 Quasar — Android UI Preview</h1>
    <div class="tabs">
      <button class="tab on" data-v="screens">App screens</button>
      <button class="tab" data-v="adb">ADB backup guide</button>
    </div>
  </header>
  <main>

    <!-- ===================== SCREENS ===================== -->
    <section class="view on" id="screens">
      <div class="layout">
        <div class="list" id="list"></div>
        <div class="stage">
          <div class="phone">
            <div class="status"><span>9:41</span><span>5G ▪▪▪▪ 87%</span></div>
            <div class="screen" id="screen"></div>
          </div>
          <div class="nav"><button id="prev">← Previous</button><span class="muted" id="pos"></span><button id="next">Next →</button></div>
        </div>
        <div class="side" id="side"></div>
      </div>
    </section>

    <!-- ===================== ADB GUIDE ===================== -->
    <section class="view" id="adb">
      <div class="guide">
        <div class="list" id="steps"></div>
        <div class="pane" id="pane"></div>
      </div>
    </section>

  </main>

  <script>
    /* ---------- tab switching ---------- */
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
      document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===t.dataset.v));
    });
    const $=s=>document.querySelector(s);

    /* ---------- APP SCREENS ---------- */
    const state={provider:'google_drive',plan:null,progress:0,timer:null};
    const plans=[
      {id:'airalo-3gb-15d',dest:'Japan',name:'Japan 3GB',gb:3,days:15,cents:1250,prov:'Airalo'},
      {id:'airalo-5gb-30d',dest:'Europe',name:'Europe 5GB',gb:5,days:30,cents:2200,prov:'Airalo'},
      {id:'esim-access-2gb-7d',dest:'Singapore',name:'Singapore 2GB',gb:2,days:7,cents:650,prov:'eSIM Access'}
    ];
    const money=c=>'$'+(c/100).toFixed(2);
    let idx=0;
    const S=[
      {group:'Getting started',id:'onboarding',title:'Onboarding',
       side:['Entry point of the app','"Start secure backup" continues to account choice','Maps to OnboardingScreen.kt'],
       render:()=>`<div class="center" style="flex:1"><div class="logo">QUASAR</div><p class="muted" style="text-align:center;margin:10px 0 24px">Your encrypted phone image backup, ready when you are.</p><button class="btn" data-go="auth_choice">Start secure backup</button></div>`},
      {group:'Getting started',id:'auth_choice',title:'Create account or sign in',
       side:['Two paths: new account or returning user','Maps to AuthChoiceScreen in Navigation.kt'],
       render:()=>`<div class="center" style="flex:1"><h2>Welcome</h2><p class="muted">Backups are encrypted on your device before anything is uploaded.</p><button class="btn" data-go="sign_up">Create account</button><button class="btn ghost" data-go="sign_in">I already have an account</button></div>`},
      {group:'Getting started',id:'sign_up',title:'Sign up',
       side:['Full name, email, password','Calls POST /api/v1/auth/register','Then continues to cloud selection'],
       render:()=>`<h2>Create account</h2><div class="field">Full name</div><div class="field">Email</div><div class="field">Password ••••••••</div><button class="btn" data-go="cloud">Create account</button>`},
      {group:'Getting started',id:'sign_in',title:'Sign in',
       side:['Calls POST /api/v1/auth/token','Token stored by TokenManager'],
       render:()=>`<h2>Sign in</h2><div class="field">Email</div><div class="field">Password ••••••••</div><button class="btn" data-go="cloud">Sign in</button>`},
      {group:'Backup flow',id:'cloud',title:'Choose storage',
       side:['Tap a provider to select it (try it)','Sent as the provider field of POST /backups/sessions','Maps to CloudSelectionScreen'],
       render:()=>{const P=[['google_drive','Google Drive','▲'],['dropbox','Dropbox','■'],['onedrive','OneDrive','☁'],['aws_s3','AWS S3','◆']];
        return `<h2>Choose your storage</h2><p class="muted">Pick where your encrypted backup is stored.</p>`+P.map(p=>`<div class="card provider ${state.provider===p[0]?'sel':''}" data-prov="${p[0]}"><div class="ico">${p[2]}</div><div style="flex:1"><div style="font-weight:700">${p[1]}</div><div class="muted" style="font-size:.75rem">Secure encrypted upload</div></div><div class="chip">Ready</div></div>`).join('')+`<button class="btn" data-go="adb">Continue</button>`;} },
      {group:'Backup flow',id:'adb',title:'ADB backup setup',
       side:['Summary screen inside the app','Full beginner walkthrough is on the "ADB backup guide" tab','Maps to AdbGuidanceScreen'],
       render:()=>`<h2>ADB backup setup</h2><p class="muted">You’ll do this once from a computer.</p>
       ${['Enable Developer options','Turn on USB debugging','Connect phone to computer by USB','Run the backup command','Approve on your phone & set a password','Upload the encrypted file'].map((t,i)=>`<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 12px"><div class="chip" style="min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0;border-radius:50%">${i+1}</div><div style="flex:1;font-size:.82rem">${t}</div></div>`).join('')}
       <button class="btn sm ghost" id="openGuide">Open full step-by-step guide</button><button class="btn" data-go="status">Backup ready</button>`},
      {group:'Backup flow',id:'status',title:'Upload status',
       side:['Progress bar is animated here (press Start)','Real app polls GET /backups/sessions/{id}','Shows the private profile link'],
       render:()=>`<h2>Upload status</h2><div class="card"><div class="row"><div><b>Session: ${state.progress>=100?'Completed':state.progress>0?'Uploading':'Queued'}</b><div class="muted">Secure connection established</div></div><b class="price">${state.progress}%</b></div><div class="bar"><i id="fill" style="width:${state.progress}%"></i></div></div>
       <button class="btn sm" id="startUp">Start simulated upload</button>
       <h3 style="margin-top:18px">Your profile</h3><p class="price" style="font-size:.9rem">quasar.app/u/your-profile</p><p class="muted">Check backup status and downloads from any device.</p>
       <button class="btn ghost" data-go="esim">Travelling? Get a travel eSIM →</button>`},
      {group:'Travel eSIM',id:'esim',title:'Browse eSIM plans',
       side:['GET /api/v1/esim/plans','Free accounts: price at cost','Premium: cost + configurable margin','Maps to TravelESimBrowseScreen'],
       render:()=>`<h2>Travel eSIM</h2><p class="muted">Get mobile data the moment you land.</p>`+plans.map((p,i)=>`<div class="card"><div class="row"><div><b>${p.dest}</b><div class="muted">${p.name}</div></div><b class="price">${money(p.cents)}</b></div><button class="btn sm ghost" data-plan="${i}">Select plan</button></div>`).join('')},
      {group:'Travel eSIM',id:'confirm',title:'Confirm purchase',
       side:['POST /api/v1/esim/orders','Shows destination, data, validity, total'],
       render:()=>{const p=state.plan||plans[0];return `<h2>Confirm purchase</h2><div class="card"><div class="row"><span class="muted">Destination</span><b>${p.dest}</b></div><div class="row" style="margin-top:8px"><span class="muted">Plan</span><b>${p.name}</b></div><div class="row" style="margin-top:8px"><span class="muted">Total</span><b class="price">${money(p.cents)}</b></div></div><button class="btn" data-go="activate">Confirm purchase</button>`;} },
      {group:'Travel eSIM',id:'activate',title:'Activation',
       side:['QR code / activation code from the provider','Install before you fly if possible','Needs an eSIM-capable phone'],
       render:()=>`<h2>Activation code</h2><p class="muted">Scan the QR code in Settings → Network & internet → SIMs → Add eSIM, or enter the code manually.</p><div class="card"><div class="code">LPA:1M3T-8J4R-9KQ2</div></div><button class="btn" data-go="usage">Done</button>`},
      {group:'Travel eSIM',id:'usage',title:'Data usage',
       side:['GET /api/v1/esim/orders/{id}/usage','Updated by provider webhooks'],
       render:()=>`<h2>Data usage</h2><div class="card"><div class="row"><div><b>Status: active</b><div class="muted">1,126 MB / 3,072 MB</div></div><b class="price">36.7%</b></div><div class="bar"><i style="width:36.7%"></i></div></div><button class="btn" data-go="onboarding">Return home</button>`},
    ];

    function buildList(){
      let g='',h='';
      S.forEach((s,i)=>{if(s.group!==g){g=s.group;h+=`<h4>${g.toUpperCase()}</h4>`}
       h+=`<div class="item ${i===idx?'on':''}" data-i="${i}">${s.title}</div>`});
      $('#list').innerHTML=h;
      $('#list').querySelectorAll('.item').forEach(e=>e.onclick=()=>{idx=+e.dataset.i;draw()});
    }
    function draw(){
      const s=S[idx];
      $('#screen').innerHTML=s.render();
      $('#screen').classList.toggle('center',false);
      $('#pos').textContent=(idx+1)+' / '+S.length;
      $('#side').innerHTML=`<h3>${s.title}</h3><ul>${s.side.map(x=>`<li>${x}</li>`).join('')}</ul>`;
      buildList();
      document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const j=S.findIndex(x=>x.id===b.dataset.go);if(j>=0){idx=j;draw()}});
      document.querySelectorAll('[data-prov]').forEach(b=>b.onclick=()=>{state.provider=b.dataset.prov;draw()});
      document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{state.plan=plans[+b.dataset.plan];idx=S.findIndex(x=>x.id==='confirm');draw()});
      const og=$('#openGuide');if(og)og.onclick=()=>document.querySelector('.tab[data-v=adb]').click();
      const su=$('#startUp');if(su)su.onclick=()=>{clearInterval(state.timer);state.progress=0;state.timer=setInterval(()=>{state.progress=Math.min(100,state.progress+5);const f=$('#fill');if(f)f.style.width=state.progress+'%';const s2=S.find(x=>x.id==='status');if(s2){$('#screen').innerHTML=s2.render();draw();}},300);};
    }
    $('#prev').onclick=()=>{idx=Math.max(0,idx-1);draw()};
    $('#next').onclick=()=>{idx=Math.min(S.length-1,idx+1);draw()};
    draw();

    /* ---------- ADB GUIDE ---------- */
    function cmd(t){return `<pre><button class="copy" onclick="copyCmd(this)">Copy</button><code>${t}</code></pre>`}
    window.copyCmd=function(b){navigator.clipboard&&navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)};
    window.osPick=function(btn,id){const p=btn.closest('.pane');p.querySelectorAll('.os button').forEach(x=>x.classList.toggle('on',x===btn));p.querySelectorAll('.ospane').forEach(x=>x.classList.toggle('on',x.id===id));}

    const G=[
      {t:'0. Read this first',h:`<h2>Before you start: what ADB backup is (and isn’t)</h2>
      <p><b>ADB</b> (Android Debug Bridge) is a tool that lets a computer talk to your phone over a USB cable. <code>adb backup</code> asks the phone to hand your data to the computer as one file.</p>
      <div class="note red"><b>Important limitation.</b> Google deprecated <code>adb backup</code> in Android 12. On newer phones, and for any app that opts out of backup, the file may contain <b>little or no app data</b>. This is why Quasar also supports photo/file copying for reliability.</div>
      <h3>What you will need</h3>
      <ul><li>A Windows, macOS or Linux computer</li><li>Your Android phone and a <b>data-capable</b> USB cable (some cables only charge)</li><li>About 20–30 minutes and free disk space roughly equal to your phone data</li></ul>
      <h3>What happens overall</h3><ol><li>Set up the tool on your computer</li><li>Switch on a hidden phone setting called USB debugging</li><li>Connect and allow the computer</li><li>Run one command to create a backup image</li><li>Encrypt it with a password</li><li>Upload the file into Quasar</li></ol>`},
      {t:'1. Install ADB',h:`<h2>Step 1 — Install ADB on your computer</h2><p>Google’s free package is called <b>platform-tools</b>. Download it from <code>developer.android.com/tools/releases/platform-tools</code>.</p>
      <div class="os"><button class="on" onclick="osPick(this,'w')">Windows</button><button onclick="osPick(this,'m')">macOS</button><button onclick="osPick(this,'l')">Linux</button></div>
      <div class="ospane on" id="w"><ol><li>Download the Windows ZIP and right-click → <b>Extract All</b> (for example to <code>C:\platform-tools</code>).</li><li>Open that folder, click the address bar, and type <code>cmd</code> then press Enter.</li><li>Verify it works:</li></ol>${cmd('adb version')}</div>
      <div class="ospane" id="m"><ol><li>Easiest: install Homebrew, then run:</li></ol>${cmd('brew install --cask android-platform-tools')}<p>Or download the macOS ZIP, unzip it and run <code>./adb</code> from inside the extracted folder.</p>${cmd('adb version')}</div>
      <div class="ospane" id="l"><p>Debian/Ubuntu:</p>${cmd('sudo apt install adb')}<p>Other distributions: download the Linux ZIP, unzip it and run <code>./adb</code>.</p>${cmd('adb version')}</div>`},
      {t:'2. Enable Developer options',h:`<h2>Step 2 — Unlock Developer options on the phone</h2><p>This menu is hidden by default so nobody changes it by accident.</p><ol><li>Open <b>Settings</b>.</li><li>Scroll down to <b>About phone</b> or <b>Software information</b>.</li><li>Tap <b>Build number</b> 7 times until you see “You are now a developer”.</li><li>Go back one screen and open <b>Developer options</b>.</li></ol>`},
      {t:'3. Turn on USB debugging',h:`<h2>Step 3 — Turn on USB debugging</h2><ol><li>Open <b>Settings → System → Developer options</b> (on some phones it is directly in Settings).</li><li>Enable <b>USB debugging</b>.</li><li>Keep the phone unlocked during the next connection step.</li></ol>`},
      {t:'4. Connect & authorize',h:`<h2>Step 4 — Connect the phone and approve the computer</h2><ol><li>Plug the phone into the computer. Unlock the phone screen.</li><li>If a notification says <b>Allow USB debugging</b>, tap <b>Allow</b>.</li><li>Confirm the computer is visible from your terminal:</li></ol>${cmd('adb devices')}<table><tr><th>What you see</th><th>Meaning / fix</th></tr><tr><td><code>unauthorized</code></td><td>You haven’t tapped Allow yet. Unlock the phone and look for the prompt. If none appears, reconnect the cable.</td></tr><tr><td><code>device</code></td><td>Good. You’re ready for the backup step.</td></tr></table>`},
      {t:'5. Run the backup',h:`<h2>Step 5 — Create the backup file</h2><p>Make a folder for your backups, open your terminal inside it, then run:</p>${cmd('adb backup -apk -shared -all -f quasar_backup.ab')}<h3>What each part means</h3><table><tr><th>Part</th><th>Meaning</th></tr><tr><td><code>-apk</code></td><td>Include the app installers (.apk files)</td></tr><tr><td><code>-shared</code></td><td>Include shared storage / media</td></tr><tr><td><code>-all</code></td><td>Back up all app data possible</td></tr><tr><td><code>-f quasar_backup.ab</code></td><td>Write the archive to your chosen file</td></tr></table>
      <h3>On the phone</h3><ol><li>A screen titled <b>“Full backup”</b> appears. <b>Keep the phone unlocked.</b></li><li>Type a <b>password</b> in “Encryption password”. This encrypts the backup file.</li><li>If prompted, tap <b>Back up my data</b>.</li></ol>
      <p>The terminal will look frozen — that is normal. It can take from a few minutes to over an hour. <b>Do not unplug or lock the phone.</b> The command ends by itself.</p>
      <h3>Check the result</h3><div class="os"><button class="on" onclick="osPick(this,'cw')">Windows</button><button onclick="osPick(this,'cm')">macOS / Linux</button></div><div class="ospane on" id="cw"><p>In File Explorer, look for <code>quasar_backup.ab</code> in the folder where you ran the command.</p></div><div class="ospane" id="cm"><p>In a terminal, run:</p>${cmd('ls -lh quasar_backup.ab')}</div>
      <div class="note red">If the file is only a few KB or a few MB when you expected gigabytes, the backup did not capture your data (common on Android 12+). Use step 6 for photos and files, and rely on Quasar’s modern file-copy workflow when possible.</div>`},
      {t:'6. Back up photos & files',h:`<h2>Step 6 — Copy photos, videos and files (reliable method)</h2><p><code>adb pull</code> copies folders from the phone straight to your computer. It works even when <code>adb backup</code> is limited or deprecated.</p>${cmd('adb pull /sdcard/DCIM ./quasar_photos')}<p>For other folders:</p>${cmd('adb shell ls /sdcard/')}<p>Then copy the folders you want into a backup directory and keep them encrypted before upload.</p>`},
      {t:'7. Upload with Quasar',h:`<h2>Step 7 — Store it safely</h2><ol><li>Open Quasar and choose your storage (Google Drive, Dropbox, OneDrive or AWS S3).</li><li>Select the encrypted archive file you created.</li><li>Wait for the upload to finish and verify the file hash or upload status in the app.</li></ol><div class="note green"><b>Best practice:</b> keep the encryption password in a password manager, not in the backup file name.</div>`},
      {t:'8. Restore',h:`<h2>Step 8 — Restoring later</h2><ol><li>Repeat steps 1–4 (install ADB, USB debugging, connect).</li><li>Place <code>quasar_backup.ab</code> in your terminal’s current folder.</li><li>Run the restore command:</li></ol>${cmd('adb restore quasar_backup.ab')}<p>For Media / Files, copy the files back from your safe storage into the original folders or use a file manager.</p>`},
      {t:'9. Troubleshooting',h:`<h2>Troubleshooting</h2><table><tr><th>Problem</th><th>Try this</th></tr><tr><td>“adb is not recognized”</td><td>Open the terminal <i>inside</i> the platform-tools folder, or add that folder to your PATH.</td></tr><tr><td>Phone not showing under adb devices</td><td>Try a different USB cable, unlock the phone, and re-authorize USB debugging.</td></tr><tr><td>Backup file is tiny</td><td>Use step 6 to copy photos/files manually, or switch to a more recent Android backup workflow.</td></tr><tr><td>Encryption password wrong</td><td>Check your password manager and re-run the restore using the exact original value.</td></tr></table>`},
    ];
    let gi=0;const done=new Set();
    function drawG(){
      $('#steps').innerHTML='<h4>STEPS</h4>'+G.map((s,i)=>`<div class="step ${i===gi?'on':''} ${done.has(i)?'done':''}" data-i="${i}">${done.has(i)?'✓ ':''}${s.t}</div>`).join('');
      $('#steps').querySelectorAll('.step').forEach(e=>e.onclick=()=>{gi=+e.dataset.i;drawG()});
      $('#pane').innerHTML=G[gi].h+`<label class="chk"><input type="checkbox" ${done.has(gi)?'checked':''} id="ck"><span>I’ve completed this step</span></label><div class="foot"><button class="btn sm ghost" id="gp">Previous</button><button class="btn sm" id="gn">Next step</button></div>`;
      $('#ck').onchange=e=>{e.target.checked?done.add(gi):done.delete(gi);drawG()};
      $('#gp').onclick=()=>{gi=Math.max(0,gi-1);drawG();scrollTo(0,0)};
      $('#gn').onclick=()=>{gi=Math.min(G.length-1,gi+1);drawG();scrollTo(0,0)};
    }
    drawG();
  </script>
</body>
</html>
