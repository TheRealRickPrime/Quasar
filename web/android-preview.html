<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quasar Android UI Preview</title>
<style>
:root{--midnight:#0b1020;--navy:#141c33;--paper:#f1f4ff;--steel:#8f9bbd;--accent:#7c5cff;--ok:#2ecc71;--warn:#f5a524;--bad:#ff5d6c;--line:#252f50}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,Roboto,system-ui,sans-serif;background:#070a14;color:var(--paper);line-height:1.5}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#070a14;z-index:20}
header h1{font-size:1.1rem;margin-right:auto}
.tabs{display:flex;gap:8px}
.tab{background:var(--navy);color:var(--paper);border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.tab.on{background:var(--accent);border-color:transparent}
main{max-width:1200px;margin:0 auto;padding:24px}
.view{display:none}.view.on{display:block}
.layout{display:grid;grid-template-columns:260px 1fr 300px;gap:24px;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
.list{background:var(--navy);border:1px solid var(--line);border-radius:14px;padding:8px}
.list h4{font-size:.72rem;letter-spacing:.08em;color:var(--steel);padding:10px 10px 4px}
.item{padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--steel);font-size:.92rem}
.item:hover{background:#1b2543;color:var(--paper)}.item.on{background:var(--accent);color:#fff}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{width:320px;height:660px;border-radius:42px;border:9px solid #000;background:var(--midnight);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px #000a;position:relative}
.status{display:flex;justify-content:space-between;padding:10px 20px 4px;font-size:.72rem;color:var(--steel)}
.screen{flex:1;overflow-y:auto;padding:18px 20px 20px;display:flex;flex-direction:column}
.screen::-webkit-scrollbar{width:0}
.screen h2{font-size:1.45rem;margin-bottom:6px}
.muted{color:var(--steel);font-size:.85rem}
.center{justify-content:center}
.logo{font-size:2rem;font-weight:800;letter-spacing:.12em;text-align:center}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:12px;color:#fff;background:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--steel);color:var(--paper)}
.btn.sm{padding:8px;font-size:.8rem;margin-top:8px}
.field{background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;color:var(--steel);font-size:.9rem}
.card{background:var(--navy);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--midnight);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.provider{display:flex;gap:12px;align-items:center;cursor:pointer}
.provider.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ico{width:34px;height:34px;border-radius:9px;background:var(--midnight);display:grid;place-items:center}
.price{color:var(--accent);font-weight:800}
.chip{font-size:.7rem;padding:3px 8px;border-radius:99px;background:#1d2850;color:#b9c4ff}
.code{font-family:ui-monospace,Consolas,monospace;font-size:1.05rem;text-align:center;color:var(--accent);letter-spacing:.05em;word-break:break-all}
.nav{display:flex;gap:10px}
.nav button{background:var(--navy);color:var(--paper);border:1px solid var(--line);padding:8px 16px;border-radius:10px;cursor:pointer}
.side{background:var(--navy);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:.88rem}
.side h3{margin-bottom:6px;font-size:1rem}.side li{margin-left:18px;color:var(--steel);margin-top:4px}
.note{background:#241c05;border:1px solid #6b5212;color:#ffd98a;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.88rem}
.note.red{background:#2a0e14;border-color:#7a2432;color:#ffb3bd}
.note.green{background:#0c2418;border-color:#1f6b41;color:#a6f0c4}
/* ADB guide */
.guide{display:grid;grid-template-columns:280px 1fr;gap:24px}
@media(max-width:900px){.guide{grid-template-columns:1fr}}
.step{display:block;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--steel);border:1px solid transparent}
.step:hover{background:#1b2543}.step.on{background:var(--navy);border-color:var(--accent);color:var(--paper)}
.step.done{color:var(--ok)}
.pane{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:26px}
.pane h2{margin-bottom:8px}.pane h3{margin:18px 0 6px;font-size:1.02rem}
.pane p,.pane li{color:#cdd5f3}.pane ol,.pane ul{margin:8px 0 8px 22px}.pane li{margin:5px 0}
pre{background:#05070f;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:.88rem;position:relative;margin:10px 0}
code{font-family:ui-monospace,Consolas,monospace;color:#9fe3ff}
.copy{position:absolute;top:8px;right:8px;background:var(--accent);border:none;color:#fff;border-radius:7px;padding:3px 9px;font-size:.72rem;cursor:pointer}
.os{display:flex;gap:8px;margin:10px 0}
.os button{background:var(--midnight);border:1px solid var(--line);color:var(--steel);padding:6px 14px;border-radius:9px;cursor:pointer}
.os button.on{background:var(--accent);color:#fff;border-color:transparent}
.ospane{display:none}.ospane.on{display:block}
.foot{display:flex;justify-content:space-between;margin-top:22px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
.chk input{margin-top:5px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--midnight)}
summary{cursor:pointer;font-weight:700;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>🔒 Quasar — Android UI Preview</h1>
  <div class="tabs">
    <button class="tab on" data-v="screens">App screens</button>
    <button class="tab" data-v="adb">ADB backup guide</button>
  </div>
</header>
<main>

<!-- ===================== SCREENS ===================== -->
<section class="view on" id="screens">
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="stage">
      <div class="phone">
        <div class="status"><span>9:41</span><span>5G ▪▪▪▪ 87%</span></div>
        <div class="screen" id="screen"></div>
      </div>
      <div class="nav"><button id="prev">← Previous</button><span class="muted" id="pos"></span><button id="next">Next →</button></div>
    </div>
    <div class="side" id="side"></div>
  </div>
</section>

<!-- ===================== ADB GUIDE ===================== -->
<section class="view" id="adb">
  <div class="guide">
    <div class="list" id="steps"></div>
    <div class="pane" id="pane"></div>
  </div>
</section>

</main>

<script>
/* ---------- tab switching ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===t.dataset.v));
});
const $=s=>document.querySelector(s);

/* ---------- APP SCREENS ---------- */
const state={provider:'google_drive',plan:null,progress:0,timer:null};
const plans=[
 {id:'airalo-3gb-15d',dest:'Japan',name:'Japan 3GB',gb:3,days:15,cents:1250,prov:'Airalo'},
 {id:'airalo-5gb-30d',dest:'Europe',name:'Europe 5GB',gb:5,days:30,cents:2200,prov:'Airalo'},
 {id:'esim-access-2gb-7d',dest:'Singapore',name:'Singapore 2GB',gb:2,days:7,cents:650,prov:'eSIM Access'}
];
const money=c=>'$'+(c/100).toFixed(2);
let idx=0;
const S=[
 {group:'Getting started',id:'onboarding',title:'Onboarding',
  side:['Entry point of the app','"Start secure backup" continues to account choice','Maps to OnboardingScreen.kt'],
  render:()=>`<div class="center" style="flex:1"><div class="logo">QUASAR</div><p class="muted" style="text-align:center;margin:10px 0 24px">Your encrypted phone image backup, ready when you are.</p><button class="btn" data-go="auth_choice">Start secure backup</button></div>`},
 {group:'Getting started',id:'auth_choice',title:'Create account or sign in',
  side:['Two paths: new account or returning user','Maps to AuthChoiceScreen in Navigation.kt'],
  render:()=>`<div class="center" style="flex:1"><h2>Welcome</h2><p class="muted">Backups are encrypted on your device before anything is uploaded.</p><button class="btn" data-go="sign_up">Create account</button><button class="btn ghost" data-go="sign_in">Sign in</button></div>`},
 {group:'Getting started',id:'sign_up',title:'Sign up',
  side:['Full name, email, password','Calls POST /api/v1/auth/register','Then continues to cloud selection'],
  render:()=>`<h2>Create account</h2><div class="field">Full name</div><div class="field">Email</div><div class="field">Password ••••••••</div><button class="btn" data-go="cloud">Create account</button>`},
 {group:'Getting started',id:'sign_in',title:'Sign in',
  side:['Calls POST /api/v1/auth/token','Token stored by TokenManager'],
  render:()=>`<h2>Sign in</h2><div class="field">Email</div><div class="field">Password ••••••••</div><button class="btn" data-go="cloud">Sign in</button>`},
 {group:'Backup flow',id:'cloud',title:'Choose storage',
  side:['Tap a provider to select it (try it)','Sent as the provider field of POST /backups/sessions','Maps to CloudSelectionScreen'],
  render:()=>{const P=[['google_drive','Google Drive','▲'],['dropbox','Dropbox','■'],['onedrive','OneDrive','☁'],['aws_s3','AWS S3','◆']];
   return `<h2>Choose your storage</h2><p class="muted">Pick where your encrypted backup is stored.</p>`+P.map(p=>`<div class="card provider ${state.provider===p[0]?'sel':''}" data-prov="${p[0]}"><div class="ico">${p[2]}</div><b>${p[1]}</b></div>`).join('')+`<button class="btn" data-go="adb">Continue</button>`}},
 {group:'Backup flow',id:'adb',title:'ADB backup setup',
  side:['Summary screen inside the app','Full beginner walkthrough is on the "ADB backup guide" tab','Maps to AdbGuidanceScreen'],
  render:()=>`<h2>ADB backup setup</h2><p class="muted">You\u2019ll do this once from a computer.</p>
  ${['Enable Developer options','Turn on USB debugging','Connect phone to computer by USB','Run the backup command','Approve on your phone & set a password','Upload the encrypted file'].map((t,i)=>`<div class="card row"><span><b>${i+1}.</b> ${t}</span></div>`).join('')}
  <button class="btn sm ghost" id="openGuide">Open full step-by-step guide</button><button class="btn" data-go="status">Backup ready</button>`},
 {group:'Backup flow',id:'status',title:'Upload status',
  side:['Progress bar is animated here (press Start)','Real app polls GET /backups/sessions/{id}','Shows the private profile link'],
  render:()=>`<h2>Upload status</h2><div class="card"><div class="row"><div><b>Session: ${state.progress>=100?'Completed':state.progress>0?'Uploading':'Queued'}</b><div class="muted">Secure connection active</div></div><b class="price" id="pct">${state.progress}%</b></div><div class="bar"><i id="fill" style="width:${state.progress}%"></i></div></div>
  <button class="btn sm" id="startUp">Start simulated upload</button>
  <h3 style="margin-top:18px">Your profile</h3><p class="price" style="font-size:.9rem">quasar.app/u/your-profile</p><p class="muted">Check backup status and downloads from any device.</p>
  <button class="btn ghost" data-go="esim">Travelling? Get a travel eSIM →</button>`},
 {group:'Travel eSIM',id:'esim',title:'Browse eSIM plans',
  side:['GET /api/v1/esim/plans','Free accounts: price at cost','Premium: cost + configurable margin','Maps to TravelESimBrowseScreen'],
  render:()=>`<h2>Travel eSIM</h2><p class="muted">Get mobile data the moment you land.</p>`+plans.map((p,i)=>`<div class="card"><div class="row"><div><b>${p.dest}</b><div class="muted">${p.name} · ${p.prov}</div></div><span class="price">${money(p.cents)}</span></div><div style="margin-top:8px"><span class="chip">${p.gb} GB</span> <span class="chip">${p.days} days</span> <span class="chip">Instant</span></div><button class="btn sm" data-plan="${i}">Buy now</button></div>`).join('')},
 {group:'Travel eSIM',id:'confirm',title:'Confirm purchase',
  side:['POST /api/v1/esim/orders','Shows destination, data, validity, total'],
  render:()=>{const p=state.plan||plans[0];return `<h2>Confirm purchase</h2><div class="card"><div class="row"><span class="muted">Destination</span><b>${p.dest}</b></div><div class="row" style="margin-top:8px"><span class="muted">Data</span><b>${p.gb} GB</b></div><div class="row" style="margin-top:8px"><span class="muted">Validity</span><b>${p.days} days</b></div><hr style="border-color:var(--line);margin:12px 0"><div class="row"><b>Total</b><b class="price">${money(p.cents)}</b></div></div><button class="btn" data-go="activate">Confirm</button><button class="btn ghost" data-go="esim">Cancel</button>`}},
 {group:'Travel eSIM',id:'activate',title:'Activation',
  side:['QR code / activation code from the provider','Install before you fly if possible','Needs an eSIM-capable phone'],
  render:()=>`<h2>Activation code</h2><p class="muted">Scan the QR code in Settings \u2192 Network & internet \u2192 SIMs \u2192 Add eSIM, or enter the code manually.</p><div class="card"><div style="width:150px;height:150px;margin:0 auto 12px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/20px 20px;border:8px solid #fff;border-radius:6px"></div><div class="code">AIRALO-3GB-15D-11204455</div></div><div class="note">Demo only \u2014 the current backend generates placeholder codes. Real codes come from the provider API.</div><button class="btn" data-go="usage">Activated</button>`},
 {group:'Travel eSIM',id:'usage',title:'Data usage',
  side:['GET /api/v1/esim/orders/{id}/usage','Updated by provider webhooks'],
  render:()=>`<h2>Data usage</h2><div class="card"><div class="row"><div><b>Status: active</b><div class="muted">1,126 MB / 3,072 MB</div></div><b class="price">36.7%</b></div><div class="bar"><i style="width:36.7%"></i></div></div><div class="card"><b>Country</b><div class="muted">JP</div></div>`}
];

function buildList(){
  let g='',h='';
  S.forEach((s,i)=>{if(s.group!==g){g=s.group;h+=`<h4>${g.toUpperCase()}</h4>`}
   h+=`<div class="item ${i===idx?'on':''}" data-i="${i}">${s.title}</div>`});
  $('#list').innerHTML=h;
  $('#list').querySelectorAll('.item').forEach(e=>e.onclick=()=>{idx=+e.dataset.i;draw()});
}
function draw(){
  const s=S[idx];
  $('#screen').innerHTML=s.render();
  $('#screen').classList.toggle('center',false);
  $('#pos').textContent=(idx+1)+' / '+S.length;
  $('#side').innerHTML=`<h3>${s.title}</h3><ul>${s.side.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  buildList();
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const j=S.findIndex(x=>x.id===b.dataset.go);if(j>=0){idx=j;draw()}});
  document.querySelectorAll('[data-prov]').forEach(b=>b.onclick=()=>{state.provider=b.dataset.prov;draw()});
  document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{state.plan=plans[+b.dataset.plan];idx=S.findIndex(x=>x.id==='confirm');draw()});
  const og=$('#openGuide');if(og)og.onclick=()=>document.querySelector('.tab[data-v=adb]').click();
  const su=$('#startUp');if(su)su.onclick=()=>{clearInterval(state.timer);state.progress=0;state.timer=setInterval(()=>{state.progress=Math.min(100,state.progress+5);const f=$('#fill'),p=$('#pct');if(f)f.style.width=state.progress+'%';if(p)p.textContent=state.progress+'%';if(state.progress>=100){clearInterval(state.timer);draw()}},250)};
}
$('#prev').onclick=()=>{idx=Math.max(0,idx-1);draw()};
$('#next').onclick=()=>{idx=Math.min(S.length-1,idx+1);draw()};
draw();

/* ---------- ADB GUIDE ---------- */
function cmd(t){return `<pre><button class="copy" onclick="copyCmd(this)">Copy</button><code>${t}</code></pre>`}
window.copyCmd=function(b){navigator.clipboard&&navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)};
window.osPick=function(btn,id){const p=btn.closest('.pane');p.querySelectorAll('.os button').forEach(x=>x.classList.toggle('on',x===btn));p.querySelectorAll('.ospane').forEach(x=>x.classList.toggle('on',x.id===id))};

const G=[
 {t:'0. Read this first',h:`<h2>Before you start: what ADB backup is (and isn\u2019t)</h2>
<p><b>ADB</b> (Android Debug Bridge) is a tool that lets a computer talk to your phone over a USB cable. <code>adb backup</code> asks the phone to hand your data to the computer as one file.</p>
<div class="note red"><b>Important limitation.</b> Google deprecated <code>adb backup</code> in Android 12. On newer phones, and for any app that opts out of backup, the file may contain <b>little or no app data</b>. Photos, videos and files in shared storage can still be copied reliably with <code>adb pull</code> (step 6). Always check the size of the result (step 5) before you trust it.</div>
<h3>What you will need</h3>
<ul><li>A Windows, macOS or Linux computer</li><li>Your Android phone and a <b>data-capable</b> USB cable (some cables only charge)</li><li>About 20\u201330 minutes and free disk space roughly equal to the data on your phone</li><li>A password you will remember. <b>If you lose it, the backup cannot be opened.</b></li></ul>
<h3>What happens overall</h3><ol><li>Set up the tool on your computer</li><li>Switch on a hidden phone setting called USB debugging</li><li>Connect and allow the computer</li><li>Run one command and approve it on the phone</li><li>Check the file, then upload it with Quasar</li></ol>`},
 {t:'1. Install ADB',h:`<h2>Step 1 \u2014 Install ADB on your computer</h2><p>Google\u2019s free package is called <b>platform-tools</b>. Download it from <code>developer.android.com/tools/releases/platform-tools</code>.</p>
<div class="os"><button class="on" onclick="osPick(this,'w')">Windows</button><button onclick="osPick(this,'m')">macOS</button><button onclick="osPick(this,'l')">Linux</button></div>
<div class="ospane on" id="w"><ol><li>Download the Windows ZIP and right-click \u2192 <b>Extract All</b> (for example to <code>C:\\platform-tools</code>).</li><li>Open that folder, click the address bar, type <code>cmd</code> and press Enter. A black window opens in the right place.</li><li>Test it:</li></ol>${cmd('adb version')}<p class="muted">If you see \u201cAndroid Debug Bridge version \u2026\u201d it worked. If Windows says \u201cnot recognized\u201d, you are in the wrong folder.</p></div>
<div class="ospane" id="m"><ol><li>Easiest: install Homebrew, then run:</li></ol>${cmd('brew install --cask android-platform-tools')}<p>Or download the macOS ZIP, unzip it and run <code>./adb</code> from that folder.</p>${cmd('adb version')}</div>
<div class="ospane" id="l"><p>Debian/Ubuntu:</p>${cmd('sudo apt install adb')}<p>Other distributions: download the Linux ZIP, unzip, and run <code>./adb</code>.</p>${cmd('adb version')}</div>`},
 {t:'2. Enable Developer options',h:`<h2>Step 2 \u2014 Unlock Developer options on the phone</h2><p>This menu is hidden by default so nobody changes it by accident.</p><ol><li>Open <b>Settings</b>.</li><li>Go to <b>About phone</b> (on some phones: <b>System \u2192 About phone</b>).</li><li>Find <b>Build number</b> (on Samsung: <b>Software information \u2192 Build number</b>).</li><li>Tap <b>Build number 7 times</b> quickly.</li><li>Enter your screen lock PIN if asked. You will see <b>\u201cYou are now a developer!\u201d</b></li></ol><div class="note">Menu names vary slightly between manufacturers. If you can\u2019t find it, use the Settings search box and type \u201cbuild number\u201d.</div>`},
 {t:'3. Turn on USB debugging',h:`<h2>Step 3 \u2014 Turn on USB debugging</h2><ol><li>Open <b>Settings \u2192 System \u2192 Developer options</b> (on some phones it is directly in Settings).</li><li>Make sure the master switch at the top is <b>On</b>.</li><li>Scroll to <b>USB debugging</b> and switch it <b>On</b>. Confirm the warning.</li></ol><div class="note green"><b>Good practice:</b> switch USB debugging back <b>Off</b> when you finish. It lets a connected computer control your phone.</div>`},
 {t:'4. Connect & authorize',h:`<h2>Step 4 \u2014 Connect the phone and approve the computer</h2><ol><li>Plug the phone into the computer. Unlock the phone screen.</li><li>If a notification says <b>Charging this device via USB</b>, tap it and choose <b>File transfer</b>.</li><li>In your terminal run:</li></ol>${cmd('adb devices')}<ol start="4"><li>A prompt appears on the phone: <b>\u201cAllow USB debugging?\u201d</b>. Tick <b>Always allow from this computer</b> and tap <b>Allow</b>.</li><li>Run <code>adb devices</code> again. You should see:</li></ol><pre><code>List of devices attached\nR58M1234ABC    device</code></pre>
<table><tr><th>What you see</th><th>Meaning / fix</th></tr><tr><td><code>unauthorized</code></td><td>You haven\u2019t tapped Allow yet. Unlock the phone and look for the prompt. If none appears: unplug, then Developer options \u2192 <b>Revoke USB debugging authorizations</b>, then reconnect.</td></tr><tr><td>(empty list)</td><td>Cable is charge-only, wrong USB mode, or on Windows the driver is missing (install your maker\u2019s USB driver or the Google USB driver). Try another cable/port.</td></tr><tr><td><code>offline</code></td><td>Unplug, run <code>adb kill-server</code>, then reconnect.</td></tr></table>`},
 {t:'5. Run the backup',h:`<h2>Step 5 \u2014 Create the backup file</h2><p>Make a folder for your backups, open your terminal inside it, then run:</p>${cmd('adb backup -apk -shared -all -f quasar_backup.ab')}
<h3>What each part means</h3><table><tr><th>Part</th><th>Meaning</th></tr><tr><td><code>-apk</code></td><td>Include the app installers (.apk files)</td></tr><tr><td><code>-shared</code></td><td>Include shared storage (SD card area)</td></tr><tr><td><code>-all</code></td><td>Back up all installed apps</td></tr><tr><td><code>-f quasar_backup.ab</code></td><td>Name of the output file</td></tr></table>
<h3>On the phone</h3><ol><li>A screen titled <b>\u201cFull backup\u201d</b> appears. <b>Keep the phone unlocked.</b></li><li>Type a <b>password</b> in \u201cEncryption password\u201d. This encrypts the file so nobody else can read it. <b>Write it down safely.</b></li><li>Tap <b>Back up my data</b>.</li></ol>
<p>The terminal will look frozen \u2014 that is normal. It can take from a few minutes to over an hour. <b>Do not unplug or lock the phone.</b> The command ends by itself.</p>
<h3>Check the result</h3><div class="os"><button class="on" onclick="osPick(this,'cw')">Windows</button><button onclick="osPick(this,'cm')">macOS / Linux</button></div><div class="ospane on" id="cw">${cmd('dir quasar_backup.ab')}</div><div class="ospane" id="cm">${cmd('ls -lh quasar_backup.ab')}</div>
<div class="note red">If the file is only a few KB or a few MB when you expected gigabytes, the backup did not capture your data (common on Android 12+). Use step 6 for photos and files, and rely on app-level cloud sync for app data.</div>`},
 {t:'6. Back up photos & files',h:`<h2>Step 6 \u2014 Copy photos, videos and files (reliable method)</h2><p><code>adb pull</code> copies folders from the phone straight to your computer. It works on every Android version.</p>${cmd('adb pull /sdcard/DCIM ./DCIM')}${cmd('adb pull /sdcard/Pictures ./Pictures')}${cmd('adb pull /sdcard/Download ./Download')}${cmd('adb pull /sdcard/Documents ./Documents')}<p class="muted">The first path is on the phone; the second is where it lands on your computer. Large folders take a while; progress is printed as it runs.</p><details><summary>Copy everything in shared storage</summary>${cmd('adb pull /sdcard/ ./phone_storage')}</details>`},
 {t:'7. Upload with Quasar',h:`<h2>Step 7 \u2014 Store it safely</h2><ol><li>Open Quasar and choose your storage (Google Drive, Dropbox, OneDrive or AWS S3).</li><li>Select <code>quasar_backup.ab</code> and your folders.</li><li>Watch progress on the <b>Upload status</b> screen.</li></ol><div class="note green"><b>Keep two copies.</b> One in the cloud and one on a drive at home. Do not store your backup password in the same place as the file.</div><div class="note">Note: the file is already protected by the password you chose on the phone. Quasar\u2019s own encryption layer is applied to the upload in addition to that.</div>`},
 {t:'8. Restore',h:`<h2>Step 8 \u2014 Restoring later</h2><ol><li>Repeat steps 1\u20134 (install ADB, USB debugging, connect).</li><li>Put <code>quasar_backup.ab</code> in your terminal\u2019s current folder.</li><li>Run:</li></ol>${cmd('adb restore quasar_backup.ab')}<ol start="4"><li>On the phone, tap <b>Restore my data</b> and enter your password.</li></ol><p>For files copied with <code>adb pull</code>, push them back:</p>${cmd('adb push ./DCIM /sdcard/DCIM')}<div class="note">Restoring onto a different phone model or a much newer Android version may skip some apps.</div>`},
 {t:'9. Troubleshooting',h:`<h2>Troubleshooting</h2><table><tr><th>Problem</th><th>Try this</th></tr><tr><td>\u201cadb is not recognized\u201d</td><td>Open the terminal <i>inside</i> the platform-tools folder, or add it to PATH.</td></tr><tr><td>Phone shows no backup screen</td><td>Unlock the phone, then run the command again. Some phones need the screen on and no screen lock timeout during backup.</td></tr><tr><td>\u201cNow unlock your device and confirm the backup operation\u201d</td><td>This is normal \u2014 look at the phone.</td></tr><tr><td>Backup finishes instantly with a tiny file</td><td>Android 12+ limitation or apps with backup disabled. Use step 6.</td></tr><tr><td>Backup button greyed out / \u201cbackup disabled\u201d</td><td>A work profile or device policy blocks it. Not fixable by the user.</td></tr><tr><td>Connection drops mid-way</td><td>Use a shorter, better cable; plug into the computer directly (no hub); disable USB power saving.</td></tr><tr><td>Forgot the password</td><td>It cannot be recovered. Create a new backup.</td></tr></table>`}
];
let gi=0;const done=new Set();
function drawG(){
  $('#steps').innerHTML='<h4>STEPS</h4>'+G.map((s,i)=>`<div class="step ${i===gi?'on':''} ${done.has(i)?'done':''}" data-i="${i}">${done.has(i)?'\u2713 ':''}${s.t}</div>`).join('');
  $('#steps').querySelectorAll('.step').forEach(e=>e.onclick=()=>{gi=+e.dataset.i;drawG()});
  $('#pane').innerHTML=G[gi].h+`<label class="chk"><input type="checkbox" ${done.has(gi)?'checked':''} id="ck"><span>I\u2019ve completed this step</span></label><div class="foot"><button class="tab" id="gp">\u2190 Back</button><button class="tab on" id="gn">Next \u2192</button></div>`;
  $('#ck').onchange=e=>{e.target.checked?done.add(gi):done.delete(gi);drawG()};
  $('#gp').onclick=()=>{gi=Math.max(0,gi-1);drawG();scrollTo(0,0)};
  $('#gn').onclick=()=>{gi=Math.min(G.length-1,gi+1);drawG();scrollTo(0,0)};
}
drawG();
</script>
</body>
</html>
